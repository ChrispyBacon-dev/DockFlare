name: Docker Image - DockFlare Agent

on:
  push:
    branches:
      - "stable"
      - "unstable"
      - "dev"
      - "dockflare-mail"
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - "dockflare-agent/**"
      - ".github/workflows/docker-agent.yml"
  pull_request:
    branches:
      - "stable"
      - "unstable"
      - "dev"
      - "dockflare-mail"
    paths:
      - "dockflare-agent/**"
      - ".github/workflows/docker-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_self_hosted:
    runs-on: self-hosted
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: alplat/dockflare-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-{{premajor}}-{{prerelease}}
            type=ref,event=branch,pattern=stable,value=latest
            type=ref,event=branch,pattern=stable,value=stable
            type=ref,event=branch,pattern=unstable,value=unstable
            type=ref,event=branch,pattern=dev,value=dev
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dockflare-agent
          file: ./dockflare-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockflare-agent
          cache-to: type=gha,mode=max,scope=dockflare-agent

  build_github_hosted_fallback:
    needs: build_self_hosted
    if: failure() || cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: alplat/dockflare-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},suffix=-{{premajor}}-{{prerelease}}
            type=ref,event=branch,pattern=stable,value=latest
            type=ref,event=branch,pattern=stable,value=stable
            type=ref,event=branch,pattern=unstable,value=unstable
            type=ref,event=branch,pattern=dev,value=dev
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dockflare-agent
          file: ./dockflare-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockflare-agent
          cache-to: type=gha,mode=max,scope=dockflare-agent
